name: movie_picker
description: Enterprise-grade neon movie picker with modern architecture
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Data Layer
  shared_preferences: ^2.3.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Animations
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  logger: ^2.4.0
  flutter_dotenv: ^5.1.0

  # Analytics & Crash Reporting (Firebase)
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5

dependency_overrides:
  analyzer: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation (ONLY what we need)
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Basic Linting (native Flutter lints only)
  flutter_lints: ^5.0.0

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
